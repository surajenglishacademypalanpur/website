<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Management | Suraj English Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<body style="display: none;" class="bg-slate-50 min-h-screen text-slate-800">

<div id="navbar"></div>

<div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-6">
        <!-- TOP CONTROLS -->
        <div class="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <select id="stdFilter" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                    <option value="">All Standards</option>
                    <option>Std. 8 (English Medium)</option>
                    <option>Std. 8 (Gujarati Medium)</option>
                    <option>Std. 9 (Gujarati Medium)</option>
                    <option>Std. 10 (Gujarati Medium)</option>
                </select>
                <input id="searchInput" placeholder="Search Name / Admission" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <button onclick="loadStudents()" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-xl px-4 py-3 text-sm transition-all duration-200 shadow-md shadow-blue-500/10 active:scale-[0.98]">
                    Load Students
                </button>
                <div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-2.5 flex items-center justify-between sm:flex-col sm:justify-center text-left sm:text-center">
                    <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Total Students</span>
                    <div id="studentCount" class="text-xl font-bold text-slate-800">0</div>
                </div>
            </div>
        </div>

        <!-- ACTION BAR -->
        <div class="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Database Actions</h3>
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="deleteSelected()" class="bg-rose-500 hover:bg-rose-600 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 shadow-sm active:scale-[0.98]">Delete Selected</button>
                <button onclick="deleteStandard()" class="bg-red-600 hover:bg-red-700 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 shadow-sm active:scale-[0.98]">Delete Standard</button>
                <button onclick="promoteStudents()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 shadow-sm active:scale-[0.98]">Promote Standard</button>
                
                <!-- Custom Upload CSV button -->
                <div class="h-10 w-px bg-slate-200 hidden sm:block mx-1"></div>
                
                <div class="flex flex-wrap items-center gap-2">
                    <label class="cursor-pointer bg-violet-600 hover:bg-violet-700 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 flex items-center gap-2 shadow-sm active:scale-[0.98]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        <span>Choose CSV</span>
                        <input type="file" id="csvFile" class="hidden" onchange="updateFileName(this)" />
                    </label>
                    <span id="fileNameDisplay" class="text-xs text-slate-400 font-medium max-w-[120px] truncate">No file chosen</span>
                    <button onclick="importCSV()" class="bg-violet-800 hover:bg-violet-900 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 shadow-sm active:scale-[0.98]">Import CSV</button>
                </div>

                <div class="h-10 w-px bg-slate-200 hidden sm:block mx-1"></div>

                <button onclick="exportExcel()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 shadow-sm active:scale-[0.98]">Export Excel</button>
                <button onclick="exportPDF()" class="bg-slate-700 hover:bg-slate-800 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-all duration-200 shadow-sm active:scale-[0.98]">Export PDF</button>
            </div>
        </div>

        <!-- ADD STUDENT -->
        <div class="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-slate-800">Add New Student</h2>
                <button onclick="toggleAddForm()" class="text-xs font-semibold uppercase tracking-wider text-slate-500 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl transition-colors duration-150">Toggle Form</button>
            </div>
            <div id="addForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <input id="admissionNo" placeholder="Admission No" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <input id="name" placeholder="Student Name" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <select id="course" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                    <option value="">Select Standard</option>
                    <option>Std. 8 (English Medium)</option>
                    <option>Std. 8 (Gujarati Medium)</option>
                    <option>Std. 9 (Gujarati Medium)</option>
                    <option>Std. 10 (Gujarati Medium)</option>
                </select>
                <input id="mobile" placeholder="Mobile" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <input id="school" placeholder="School" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <button onclick="addStudent()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl px-4 py-3 text-sm transition-all duration-200 shadow-md shadow-emerald-500/10 active:scale-[0.98]">Add Student</button>
            </div>
        </div>

        <!-- STUDENT TABLE -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 font-semibold text-slate-700 w-12"></th>
                            <th class="px-6 py-4 font-semibold text-slate-700">Admission</th>
                            <th class="px-6 py-4 font-semibold text-slate-700">Name</th>
                            <th class="px-6 py-4 font-semibold text-slate-700">Standard</th>
                            <th class="px-6 py-4 font-semibold text-slate-700">Mobile</th>
                            <th class="px-6 py-4 font-semibold text-slate-700">School</th>
                            <th class="px-6 py-4 font-semibold text-slate-700 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity duration-300">
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-2xl w-full max-w-md transform transition-all duration-300">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Edit Student Details</h2>
        <input type="hidden" id="editId">
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Admission No</label>
                <input id="editAdmission" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Student Name</label>
                <input id="editName" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Standard / Course</label>
                <select id="editCourse" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                    <option>Std. 8 (English Medium)</option>
                    <option>Std. 8 (Gujarati Medium)</option>
                    <option>Std. 9 (Gujarati Medium)</option>
                    <option>Std. 10 (Gujarati Medium)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Mobile Number</label>
                <input id="editMobile" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">School</label>
                <input id="editSchool" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
            </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
            <button onclick="closeEdit()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-xl transition-colors duration-150">Cancel</button>
            <button onclick="updateStudent()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl transition-colors duration-150 shadow-md shadow-blue-500/10">Save Changes</button>
        </div>
    </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
addDoc,
query,
where,
deleteDoc,
doc,
updateDoc,
writeBatch
}
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyACOURK_ZQEuxuZqP5Xfv_lZ29Nj59uHj8",
authDomain: "suraj-english-academy-7141e.firebaseapp.com",
projectId: "suraj-english-academy-7141e",
storageBucket: "suraj-english-academy-7141e.firebasestorage.app",
messagingSenderId: "291322319555",
appId: "1:291322319555:web:9ad5bb47e56ee27b9dc876"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.updateFileName = function(input) {
const display = document.getElementById("fileNameDisplay");
if (input.files && input.files[0]) {
display.innerText = input.files[0].name;
display.classList.remove("text-slate-400");
display.classList.add("text-slate-700", "font-bold");
} else {
display.innerText = "No file chosen";
display.classList.remove("text-slate-700", "font-bold");
display.classList.add("text-slate-400");
}
};

onAuthStateChanged(auth, (user) => {
if (!user) {
window.location = "index.html";
} else {
document.body.style.display = "";
}
});

window.logout = function() {
signOut(auth).then(() => {
window.location = "index.html";
});
};
let students=[];
let filteredStudents=[];
window.toggleAddForm=function(){
const form=document.getElementById("addForm");
form.classList.toggle("hidden");
}

/* LOAD STUDENTS */
window.loadStudents = async function(){
const std=document.getElementById("stdFilter").value;
let q;
if(std){
q=query(collection(db,"students"),where("course","==",std));
}else{
q=collection(db,"students");
}
const snapshot=await getDocs(q);
students=[];
snapshot.forEach(d=>{
students.push({id:d.id,...d.data()});
});
filteredStudents=[...students];
renderTable();
}

/* RENDER TABLE */
function renderTable(){
const table=document.getElementById("studentTable");
const search=document.getElementById("searchInput").value.toLowerCase();
let data=filteredStudents.filter(s=>
(s.name||"").toLowerCase().includes(search) ||
(s.admissionNo||"").toLowerCase().includes(search)
);
document.getElementById("studentCount").innerText=data.length;
table.innerHTML="";
data.forEach(s=>{
const row=`
<tr class="hover:bg-slate-50/50 transition-colors duration-150">
<td class="px-6 py-4 border-b border-slate-100 align-middle">
<input type="checkbox" value="${s.id}" class="studentCheck rounded text-blue-600 focus:ring-blue-500 border-slate-300 w-4 h-4">
</td>
<td class="px-6 py-4 border-b border-slate-100 align-middle font-mono text-xs text-slate-500">${s.admissionNo}</td>
<td class="px-6 py-4 border-b border-slate-100 align-middle font-semibold text-slate-800">${s.name}</td>
<td class="px-6 py-4 border-b border-slate-100 align-middle text-slate-600">${s.course}</td>
<td class="px-6 py-4 border-b border-slate-100 align-middle text-slate-600">${s.mobile}</td>
<td class="px-6 py-4 border-b border-slate-100 align-middle text-slate-600">${s.school}</td>
<td class="px-6 py-4 border-b border-slate-100 align-middle text-right space-x-2">
<button onclick="editStudent('${s.id}')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 hover:text-amber-900 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-150">Edit</button>
<button onclick="deleteStudent('${s.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-800 hover:text-rose-900 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors duration-150">Delete</button>
</td>
</tr>
`;
table.innerHTML+=row;
});
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",renderTable);

/* ADD STUDENT */
window.addStudent = async function(){
const admissionNo=document.getElementById("admissionNo").value;
const name=document.getElementById("name").value;
const course=document.getElementById("course").value;
const mobile=document.getElementById("mobile").value;
const school=document.getElementById("school").value;
if(!admissionNo || !name || !course){
alert("Fill required fields");
return;
}
await addDoc(collection(db,"students"),{
admissionNo,
name,
course,
mobile,
school
});
loadStudents();
}

/* DELETE */
window.deleteStudent = async function(id){
if(!confirm("Delete student?")) return;
await deleteDoc(doc(db,"students",id));
loadStudents();
}

/* DELETE SELECTED */
window.deleteSelected = async function(){
const checks=document.querySelectorAll(".studentCheck:checked");
for(const c of checks){
await deleteDoc(doc(db,"students",c.value));
}
loadStudents();
}

/* DELETE STANDARD */
window.deleteStandard = async function(){
const std=document.getElementById("stdFilter").value;
if(!std) return alert("Select standard");
if(!confirm("Delete all students of this standard?")) return;
const q=query(collection(db,"students"),where("course","==",std));
const snapshot=await getDocs(q);
for(const d of snapshot.docs){
await deleteDoc(doc(db,"students",d.id));
}
loadStudents();
}

/* PROMOTE */
window.promoteStudents = async function(){
const std=document.getElementById("stdFilter").value;
if(!std) return alert("Select standard");
let next;
if(std.includes("Std. 8")) next="Std. 9 (Gujarati Medium)";
else if(std.includes("Std. 9")) next="Std. 10 (Gujarati Medium)";
else return alert("Std 10 cannot promote");
const q=query(collection(db,"students"),where("course","==",std));
const snapshot=await getDocs(q);
for(const d of snapshot.docs){
await updateDoc(doc(db,"students",d.id),{course:next});
}
loadStudents();
}

/* EXPORT EXCEL */
window.exportExcel=function(){
const data=filteredStudents.map(s=>({
Admission:s.admissionNo,
Name:s.name,
Standard:s.course,
Mobile:s.mobile,
School:s.school
}));
const ws=XLSX.utils.json_to_sheet(data);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Students");
XLSX.writeFile(wb,"students.xlsx");
}

/* EXPORT PDF */
window.exportPDF=function(){
const { jsPDF } = window.jspdf;
const doc=new jsPDF();
let y=20;
doc.setFontSize(16);
doc.text("Suraj English Academy - Student List",105,10,null,null,"center");
doc.setFontSize(10);
filteredStudents.forEach(s=>{
if(y>280){
doc.addPage();
y=20;
}
const row=`${s.admissionNo} | ${s.name} | ${s.course} | ${s.mobile}`;
doc.text(row,10,y);
y+=7;
});
doc.save("students.pdf");
}

/* EDIT */
window.editStudent=function(id){
const student=students.find(s=>s.id===id);
if(!student) return;
document.getElementById("editId").value=id;
document.getElementById("editAdmission").value=student.admissionNo;
document.getElementById("editName").value=student.name;
document.getElementById("editCourse").value=student.course;
document.getElementById("editMobile").value=student.mobile;
document.getElementById("editSchool").value=student.school;
document.getElementById("editModal").classList.remove("hidden");
document.getElementById("editModal").classList.add("flex");
}
window.closeEdit=function(){
document.getElementById("editModal").classList.add("hidden");
}
window.updateStudent=async function(){
const id=document.getElementById("editId").value;
await updateDoc(doc(db,"students",id),{
admissionNo:document.getElementById("editAdmission").value,
name:document.getElementById("editName").value,
course:document.getElementById("editCourse").value,
mobile:document.getElementById("editMobile").value,
school:document.getElementById("editSchool").value
});
closeEdit();
loadStudents();
}

/* CSV IMPORT */
window.importCSV=function(){
const file=document.getElementById("csvFile").files[0];
if(!file) return alert("Select CSV file first");
Papa.parse(file,{
header:true,
skipEmptyLines:'greedy',
complete:async function(results){
console.log("Parsed CSV Results:", results);

if(results.errors && results.errors.length > 0){
console.warn("CSV parsing warnings/errors:", results.errors);
}

if(!results.data || results.data.length === 0){
return alert("No data found in the CSV file.");
}

let importCount = 0;
let skipCount = 0;

let batch = writeBatch(db);
let batchCount = 0;

for(const row of results.data){
// Normalize keys to lowercase and remove non-alphanumeric chars
const normalizedRow = {};
for(const key in row){
const normalizedKey = key.toLowerCase().replace(/[^a-z0-9]/g, "");
normalizedRow[normalizedKey] = row[key];
}

const admissionNo = normalizedRow["admissionno"] || normalizedRow["admissionnumber"] || normalizedRow["admno"] || normalizedRow["admission"];
const name = normalizedRow["name"] || normalizedRow["studentname"] || normalizedRow["fullname"] || normalizedRow["student"];
const course = normalizedRow["course"] || normalizedRow["standard"] || normalizedRow["class"] || normalizedRow["std"];
const mobile = normalizedRow["mobile"] || normalizedRow["phone"] || normalizedRow["contact"] || normalizedRow["mobileno"] || "";
const school = normalizedRow["school"] || normalizedRow["schoolname"] || "";

if(!admissionNo || !name || !course){
skipCount++;
continue;
}

const newDocRef = doc(collection(db, "students"));
batch.set(newDocRef, {
admissionNo: String(admissionNo).trim(),
name: String(name).trim(),
course: String(course).trim(),
mobile: String(mobile).trim(),
school: String(school).trim()
});

importCount++;
batchCount++;

if(batchCount === 500){
try{
await batch.commit();
batch = writeBatch(db);
batchCount = 0;
}catch(e){
console.error("Batch commit failed:", e);
return alert("Failed to import batch: " + e.message);
}
}
}

if(batchCount > 0){
try{
await batch.commit();
}catch(e){
console.error("Final batch commit failed:", e);
return alert("Failed to import final batch: " + e.message);
}
}

alert("Import completed! Successfully imported " + importCount + " students. Skipped " + skipCount + " due to missing fields.");
loadStudents();
},
error: function(err){
console.error("CSV Parse Error:", err);
alert("Error parsing CSV: " + err.message);
}
});
}
</script>


<script>

.then(res => res.text())

function toggleMenu(){

}

  </script>
  
</body>
