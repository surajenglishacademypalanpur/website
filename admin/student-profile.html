<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile | Suraj English Academy</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="display: none;" class="bg-slate-50 min-h-screen text-slate-800">
<!-- LOAD NAVBAR -->
<div id="navbar"></div>

<div class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
    <h1 class="text-xl font-bold mb-6 text-slate-850">Student Profile Lookup</h1>
    
    <!-- SELECT STANDARD + STUDENT -->
    <div class="bg-white border border-slate-100 p-6 rounded-2xl shadow-sm mb-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <select id="stdSelect" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <option value="">Select Standard</option>
                <option value="Std. 8 (English Medium)">Std. 8 (English Medium)</option>
                <option value="Std. 8 (Gujarati Medium)">Std. 8 (Gujarati Medium)</option>
                <option value="Std. 9 (Gujarati Medium)">Std. 9 (Gujarati Medium)</option>
                <option value="Std. 10 (Gujarati Medium)">Std. 10 (Gujarati Medium)</option>
            </select>
            <select id="studentSelect" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200">
                <option value="">Select Student</option>
            </select>
        </div>
    </div>

    <!-- STUDENT PROFILE -->
    <div id="profileBox" class="hidden bg-white border border-slate-100 p-6 rounded-2xl shadow-sm">
        <h2 class="text-md font-bold text-slate-850 uppercase tracking-wider mb-4">Student Details</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm font-medium">
            <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100">
                <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Student Name</span>
                <span id="pName" class="text-base font-bold text-slate-850"></span>
            </div>
            <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100">
                <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Admission No</span>
                <span id="pAdmission" class="text-base font-bold text-slate-850 font-mono"></span>
            </div>
            <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100">
                <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Mobile Number</span>
                <span id="pMobile" class="text-base font-bold text-slate-850"></span>
            </div>
            <div class="bg-slate-50/50 p-4 rounded-xl border border-slate-100">
                <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Standard / Course</span>
                <span id="pCourse" class="text-base font-bold text-slate-850"></span>
            </div>
        </div>
    </div>

    <!-- FEES SUMMARY -->
    <div id="feesBox" class="hidden bg-white border border-slate-100 p-6 rounded-2xl shadow-sm mt-6">
        <h2 class="text-md font-bold text-slate-850 uppercase tracking-wider mb-4">Fees Summary</h2>
        <div class="grid grid-cols-3 gap-4 text-center">
            <div class="bg-slate-50/50 border border-slate-100 p-4 rounded-xl">
                <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">Total Fees</p>
                <p class="text-lg font-extrabold text-slate-850">₹ <span id="totalFee">10000</span></p>
            </div>
            <div class="bg-emerald-50/50 border border-emerald-100/50 p-4 rounded-xl">
                <p class="text-emerald-600 text-xs font-semibold uppercase tracking-wider mb-1">Paid Fees</p>
                <p class="text-lg font-extrabold text-emerald-800">₹ <span id="paidFee">0</span></p>
            </div>
            <div class="bg-rose-50/50 border border-rose-100/50 p-4 rounded-xl">
                <p class="text-rose-600 text-xs font-semibold uppercase tracking-wider mb-1">Due Fees</p>
                <p class="text-lg font-extrabold text-rose-800">₹ <span id="dueFee">0</span></p>
            </div>
        </div>
    </div>

    <!-- RESULT HISTORY -->
    <div id="resultBox" class="hidden bg-white border border-slate-100 p-6 rounded-2xl shadow-sm mt-6">
        <h2 class="text-md font-bold text-slate-850 uppercase tracking-wider mb-4">Result History</h2>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 font-semibold text-slate-700">Exam</th>
                            <th class="px-6 py-4 font-semibold text-slate-700">Date</th>
                            <th class="px-6 py-4 font-semibold text-slate-700">Marks</th>
                        </tr>
                    </thead>
                    <tbody id="resultTable" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>
</div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyACOURK_ZQEuxuZqP5Xfv_lZ29Nj59uHj8",
authDomain: "suraj-english-academy-7141e.firebaseapp.com",
projectId: "suraj-english-academy-7141e",
storageBucket: "suraj-english-academy-7141e.firebasestorage.app",
messagingSenderId: "291322319555",
appId: "1:291322319555:web:9ad5bb47e56ee27b9dc876"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

// Check login status
onAuthStateChanged(auth, (user) => {
if (!user) {
window.location = "index.html";
} else {
document.body.style.display = "";
}
});

// Logout handler
window.logout = function() {
signOut(auth).then(() => {
window.location = "index.html";
});
};

const yearlyFee = 10000;

let students=[];


/* LOAD STUDENTS */

document.getElementById("stdSelect").addEventListener("change",async function(){

const std=this.value;

const q=query(collection(db,"students"),where("course","==",std));

const snapshot=await getDocs(q);

students=[];

const dropdown=document.getElementById("studentSelect");

dropdown.innerHTML='<option value="">Select Student</option>';

snapshot.forEach(doc=>{

const data=doc.data();

students.push(data);

const option=document.createElement("option");

option.value=data.admissionNo;

option.text=data.name;

dropdown.appendChild(option);

});

});


/* STUDENT SELECTED */

document.getElementById("studentSelect").addEventListener("change",async function(){

const admission=this.value;

const student=students.find(s=>s.admissionNo===admission);

if(!student) return;


/* PROFILE */

document.getElementById("pName").innerText = student.name;

document.getElementById("pAdmission").innerText=student.admissionNo;

document.getElementById("pMobile").innerText=student.mobile;

document.getElementById("pCourse").innerText=student.course;

document.getElementById("profileBox").classList.remove("hidden");


/* FEES */

const feeQuery=query(
collection(db,"fees"),
where("admissionNo","==",admission)
);

const feeSnap=await getDocs(feeQuery);

let paid=0;

feeSnap.forEach(doc=>{
paid+=Number(doc.data().amount);
});

const due=yearlyFee-paid;

document.getElementById("paidFee").innerText=paid;

document.getElementById("dueFee").innerText=due;

document.getElementById("feesBox").classList.remove("hidden");


/* RESULTS */

const resultQuery=query(
collection(db,"results"),
where("admissionNo","==",admission)
);

const resultSnap=await getDocs(resultQuery);

const table=document.getElementById("resultTable");

table.innerHTML="";

resultSnap.forEach(doc=>{

const r=doc.data();

table.innerHTML+=`
<tr class="hover:bg-slate-50/50 transition-colors duration-150">
<td class="px-6 py-4 border-b border-slate-100 font-semibold text-slate-800">${r.examName}</td>
<td class="px-6 py-4 border-b border-slate-100 text-slate-650 font-mono text-xs">${r.examDate}</td>
<td class="px-6 py-4 border-b border-slate-100 font-extrabold text-blue-600">${r.marks}</td>
</tr>
`;

});

document.getElementById("resultBox").classList.remove("hidden");

});

</script>

<script>
fetch("navbar.html")
.then(res => res.text())
.then(data => {
document.getElementById("navbar").innerHTML = data;

/* highlight active page */
const links = document.querySelectorAll(".nav-link");
const currentPage = window.location.pathname.split("/").pop();

links.forEach(link => {
if(link.getAttribute("href") === currentPage){
link.style.background = "#1e40af";
link.style.padding = "6px 10px";
link.style.borderRadius = "6px";
}
});
});

/* mobile menu */
function toggleMenu(){
const menu=document.getElementById("mobileMenu");
if(menu){
menu.classList.toggle("hidden");
}
}
</script>
</body>
</html>
