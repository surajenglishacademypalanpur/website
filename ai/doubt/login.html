<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Suraj English Academy</title>
  
  <!-- Google Fonts: Playfair Display (Serif) & Outfit (Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
  
  <style>
    :root {
      --primary: #4a7a5e;
      --primary-dark: #345840;
      --primary-light: rgba(74, 122, 94, 0.08);
      --accent: #e8a33d;
      --bg: #faf6ee;
      --card-bg: #ffffff;
      --text: #2c3e35;
      --text-muted: #6e8477;
      --border-color: rgba(74, 122, 94, 0.15);
      --system-red: #fde8e8;
      --system-red-border: #f8b4b4;
      --radius: 16px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px 30px;
      box-shadow: 0 8px 24px rgba(52, 88, 64, 0.04);
      text-align: center;
    }

    .logo-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      border: 1.5px solid var(--border-color);
      margin-bottom: 20px;
    }

    .login-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.98rem;
      font-family: inherit;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      outline: none;
      transition: var(--transition);
      color: var(--text);
      background-color: #fcfbfa;
    }

    .form-control:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(74, 122, 94, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 12px 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      background-color: #c9c5bd;
      cursor: not-allowed;
      transform: none;
    }

    .error-banner {
      background-color: var(--system-red);
      border: 1px solid var(--system-red-border);
      color: #9b1c1c;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: left;
      margin-bottom: 20px;
      line-height: 1.4;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-badge">S</div>
    <div class="login-header">
      <h1>Suraj English Academy</h1>
      <p>Student AI Assistant Login</p>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="enrollmentNo">Enrollment Number</label>
        <input 
          type="text" 
          id="enrollmentNo" 
          class="form-control" 
          placeholder="e.g. 2024CS001" 
          required 
          autocomplete="username"
        >
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>
      <button type="submit" id="submitBtn" class="btn-login">Login to Assistant</button>
    </form>
  </div>

  <script src="firebase-config.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const enrollmentInput = document.getElementById("enrollmentNo");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const errorBanner = document.getElementById("errorBanner");

    // Protect login page: redirect straight to index.html if user is logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        // Double-check: Admins should not be redirected here
        if (user.email && !user.email.endsWith("@surajenglishacademy.in")) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "index.html";
        }
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const enrollmentVal = enrollmentInput.value.trim().toLowerCase();
      const passwordVal = passwordInput.value;

      // Silent email conversion for students
      const email = `${enrollmentVal}@surajenglishacademy.in`;

      try {
        await auth.signInWithEmailAndPassword(email, passwordVal);
      } catch (error) {
        console.error("Login failed:", error);
        errorBanner.textContent = "Incorrect enrollment number or password. Please contact the academy if you're having trouble.";
        errorBanner.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Login to Assistant";
      }
    });
  </script>
</body>
</html>
